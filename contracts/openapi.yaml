openapi: "3.1.0"
info:
  title: DRIFT — Maritime SAR Decision Support API
  version: "0.1.0"
  description: |
    Probabilistic search-zone calculation and AI operational briefing
    for maritime Search and Rescue (SAR) commanders.

    **Data contract rule**: All geographic data is GeoJSON FeatureCollection
    with coordinates in [longitude, latitude] order (RFC 7946).

servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://api.drift.example.com/v1
    description: Production (placeholder)

tags:
  - name: predictions
    description: Drift prediction lifecycle (L1–L3 engine)
  - name: briefings
    description: L4 AI operational briefing
  - name: risk-forecasts
    description: P1 proactive risk heatmap

paths:
  /predictions:
    post:
      summary: Submit a new drift prediction request
      operationId: createPrediction
      tags: [predictions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionRequest"
            example:
              $ref: "#/components/examples/PredictionRequestExample"
      responses:
        "202":
          description: Prediction accepted; computation is asynchronous
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionAccepted"
        "422":
          $ref: "#/components/responses/ValidationError"

  /predictions/{request_id}:
    get:
      summary: Poll for prediction result
      operationId: getPrediction
      tags: [predictions]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Prediction complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnginePredictionResult"
        "202":
          description: Still computing
        "404":
          $ref: "#/components/responses/NotFound"

  /predictions/{request_id}/brief:
    post:
      summary: Generate L4 AI operational briefing for a completed prediction
      operationId: createBriefing
      tags: [briefings]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Briefing generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Prediction not yet complete

  /risk-forecasts:
    post:
      summary: Generate P1 proactive risk heatmap
      operationId: createRiskForecast
      tags: [risk-forecasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskForecastRequest"
      responses:
        "200":
          description: Risk forecast result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskForecastResult"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  parameters:
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"

  examples:
    PredictionRequestExample:
      summary: Yeongpyeong-do fishing vessel
      value:
        request_id: "a1b2c3d4-0001-0001-0001-a1b2c3d40001"
        vessel_id: "V-PASS-123456789"
        last_coordinate:
          lon: 124.372
          lat: 37.9588
        last_seen_at: "2026-05-21T08:15:00+09:00"
        vessel_type: "소형어선"
        tonnage_tons: 29.0
        simulation_hours: 6

  schemas:
    # -----------------------------------------------------------------------
    # Inline lightweight schemas (full schemas are in contracts/schemas/*.json)
    # -----------------------------------------------------------------------
    PredictionAccepted:
      type: object
      required: [request_id, status, poll_url]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted]
        poll_url:
          type: string
          description: "URL to GET for the result"

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    # Coordinate
    Coordinate:
      type: object
      required: [lon, lat]
      properties:
        lon:
          type: number
          minimum: -180
          maximum: 180
        lat:
          type: number
          minimum: -90
          maximum: 90

    # GeoJSON FeatureCollection (permissive — detailed validation in Pydantic)
    GeoJSONFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object

    # PredictionRequest (abbreviated — authoritative in contracts/schemas/)
    PredictionRequest:
      type: object
      required: [last_coordinate, last_seen_at, vessel_type]
      properties:
        request_id:
          type: string
          format: uuid
        vessel_id:
          type: string
          nullable: true
        last_coordinate:
          $ref: "#/components/schemas/Coordinate"
        last_seen_at:
          type: string
          format: date-time
        vessel_type:
          type: string
          enum:
            - 소형어선
            - 표준어선
            - 구명조끼착용자
            - 구명뗏목
            - 레저보트
        tonnage_tons:
          type: number
          minimum: 0
          nullable: true
        simulation_hours:
          type: integer
          minimum: 1
          maximum: 24
          default: 6

    # EnginePredictionResult (abbreviated)
    EnginePredictionResult:
      type: object
      required:
        - request_id
        - computed_at
        - elapsed_seconds
        - time_horizon_hours
        - drift_vector
        - predicted_center
        - search_zones
        - l3_correction_applied
        - data_freshness_ok
      properties:
        request_id:
          type: string
        computed_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: number
        time_horizon_hours:
          type: integer
        search_zones:
          $ref: "#/components/schemas/GeoJSONFeatureCollection"
        l3_correction_applied:
          type: boolean
        data_freshness_ok:
          type: boolean

    # BriefingResult (abbreviated)
    BriefingResult:
      type: object
      required:
        - request_id
        - generated_at
        - elapsed_seconds
        - risk_score
        - confidence_label
        - sections
        - disclaimer
      properties:
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        confidence_label:
          type: string
        sections:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [section_id, title, body]
            properties:
              section_id:
                type: integer
              title:
                type: string
              body:
                type: string
        disclaimer:
          type: string

    # RiskForecastRequest
    RiskForecastRequest:
      type: object
      required: [area_name, bbox, time_range_start, time_range_end, vessel_types_targeted]
      properties:
        area_name:
          type: string
        bbox:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: "[min_lon, min_lat, max_lon, max_lat]"
        time_range_start:
          type: string
          format: date-time
        time_range_end:
          type: string
          format: date-time
        vessel_types_targeted:
          type: array
          items:
            type: string

    # RiskForecastResult (abbreviated)
    RiskForecastResult:
      type: object
      required:
        - forecast_id
        - forecasted_at
        - area_name
        - risk_grid
        - dri_score
        - risk_causes
        - recommended_actions
      properties:
        forecast_id:
          type: string
        forecasted_at:
          type: string
          format: date-time
        area_name:
          type: string
        risk_grid:
          $ref: "#/components/schemas/GeoJSONFeatureCollection"
        dri_score:
          type: number
          minimum: 0
          maximum: 1
        dri_percentile:
          type: number
          minimum: 0
          maximum: 100
